\* SAFE model, wider instance: three idempotency keys and one more amount.
\* Both unsafe behaviours disabled.  Same invariants and properties as
\* AlakaInFlight.cfg.
\* Expected result: "Model checking completed. No error has been found."
\* (about 0.94 million distinct states, roughly 15 seconds on 16 cores).
\*
\* Amounts: 3, 4 and 6 are reservable; 7 is above MaxPerTx.  3 + 3 + 4 and
\* 4 + 6 fit the budget of 10, so up to three intents can be in flight at
\* once; 6 + 6 and 4 + 4 + 3 do not fit.
SPECIFICATION Spec

CONSTANTS
    IdempKeys = {"k1", "k2", "k3"}
    Amounts = {3, 4, 6, 7}
    MandateBudget = 10
    MaxPerTx = 6
    PartialCaptureAmounts = {2, 4}
    AllowBlindVoidWithoutCancel = FALSE
    AllowVoidOnCancelFailure = FALSE

INVARIANTS
    TypeOK
    I1_NoMandateOverspent
    ExactCaptureConsistency
    I3_LedgerConservation
    LedgerMatchesIntents
    I6_NoSilentRailDrift
    ProcessingKeepsHeldLocked
    VoidedOnlyAfterRailCanceled
    RailWorstCaseExposureWithinBudget
    OpenIntentCanAlwaysProgress

PROPERTIES
    I5_MonotonicStateMachine
    RailMonotonic
    I2_OneReservationAndOneChargePerKey
    I4_RevokedMandateReservesNothing

CHECK_DEADLOCK TRUE

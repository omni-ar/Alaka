\* SAFE model: both unsafe behaviours disabled.
\* Expected result: "Model checking completed. No error has been found."
\*
\* Amounts: 4 and 6 are reservable; 7 is above MaxPerTx and must never be
\* reserved.  6 + 6 exceeds the budget of 10 (the overspend the unsafe cfgs
\* reproduce); 4 + 6 fits, so two intents can be in flight at once.  A PI
\* authorized for 6 may be charged 6, 4 or 2; one authorized for 4 may be
\* charged 4 or 2.
SPECIFICATION Spec

CONSTANTS
    IdempKeys = {"k1", "k2"}
    Amounts = {4, 6, 7}
    MandateBudget = 10
    MaxPerTx = 6
    PartialCaptureAmounts = {2, 4}
    AllowBlindVoidWithoutCancel = FALSE
    AllowVoidOnCancelFailure = FALSE

INVARIANTS
    TypeOK
    I1_NoMandateOverspent
    ExactCaptureConsistency
    I3_LedgerConservation
    LedgerMatchesIntents
    I6_NoSilentRailDrift
    ProcessingKeepsHeldLocked
    VoidedOnlyAfterRailCanceled
    RailWorstCaseExposureWithinBudget
    OpenIntentCanAlwaysProgress

PROPERTIES
    I5_MonotonicStateMachine
    RailMonotonic
    I2_OneReservationAndOneChargePerKey
    I4_RevokedMandateReservesNothing

CHECK_DEADLOCK TRUE

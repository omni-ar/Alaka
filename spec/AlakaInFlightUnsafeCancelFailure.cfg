\* UNSAFE model, bug 2 only: /cancel was rejected because the PI is
\* PROCESSING and the recovery worker voids locally anyway.
\* Expected result: invariant I6_NoSilentRailDrift is violated.
\* Same constants as AlakaInFlight.cfg.  The safe-only invariants
\* (ProcessingKeepsHeldLocked, VoidedOnlyAfterRailCanceled,
\* RailWorstCaseExposureWithinBudget, OpenIntentCanAlwaysProgress) are omitted
\* so the violation is reported against a CLAUDE.md invariant.
SPECIFICATION Spec

CONSTANTS
    IdempKeys = {"k1", "k2"}
    Amounts = {4, 6, 7}
    MandateBudget = 10
    MaxPerTx = 6
    PartialCaptureAmounts = {2, 4}
    AllowBlindVoidWithoutCancel = FALSE
    AllowVoidOnCancelFailure = TRUE

INVARIANTS
    TypeOK
    I1_NoMandateOverspent
    ExactCaptureConsistency
    I3_LedgerConservation
    LedgerMatchesIntents
    I6_NoSilentRailDrift

PROPERTIES
    I5_MonotonicStateMachine
    RailMonotonic
    I2_OneReservationAndOneChargePerKey
    I4_RevokedMandateReservesNothing

CHECK_DEADLOCK TRUE

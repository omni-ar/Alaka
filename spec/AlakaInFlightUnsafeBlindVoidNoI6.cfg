\* UNSAFE model, bug 1 only, with I6 deliberately NOT checked so that TLC
\* runs on to the overspend itself.
\* Expected result: invariant I1_NoMandateOverspent is violated (the rail has
\* charged more than MandateBudget).
SPECIFICATION Spec

CONSTANTS
    IdempKeys = {"k1", "k2"}
    Amounts = {4, 6, 7}
    MandateBudget = 10
    MaxPerTx = 6
    PartialCaptureAmounts = {2, 4}
    AllowBlindVoidWithoutCancel = TRUE
    AllowVoidOnCancelFailure = FALSE

INVARIANTS
    TypeOK
    I1_NoMandateOverspent
    ExactCaptureConsistency
    I3_LedgerConservation
    LedgerMatchesIntents

PROPERTIES
    I5_MonotonicStateMachine
    RailMonotonic
    I2_OneReservationAndOneChargePerKey
    I4_RevokedMandateReservesNothing

CHECK_DEADLOCK TRUE

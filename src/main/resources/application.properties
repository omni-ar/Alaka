# Alaka gateway. Every alaka.* value without a default must be supplied (environment variables
# such as ALAKA_DB_URL, ALAKA_STRIPE_SECRET_KEY bind by Spring's relaxed binding).
spring.application.name=alaka
spring.main.banner-mode=off
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never

alaka.mode=hardened-pessimistic
alaka.db.username=alaka_app

# Operations: only health and Prometheus metrics are exposed (see AlakaMetrics).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Alaka local development / CI infrastructure.
#
# LOCAL DEV AND CI ONLY. The credentials below (postgres / alaka_dev_only) are
# throwaway values for a database that lives on a developer machine or a CI
# runner. They are deliberately committed, must never be reused anywhere else,
# and nothing in this file is suitable for a production deployment.
#
# Host ports are non-default on purpose so this stack does not collide with a
# Postgres already listening on 5432, and below 49152 on purpose: Windows
# (Hyper-V / WinNAT) reserves random ranges of the dynamic port range 49152-65535
# at boot, and once held 54238-54337, making the earlier defaults 54329/54330
# unbindable. Override with ALAKA_PG_HOST_PORT / ALAKA_TOXI_HOST_PORT.
#   25432 -> postgres:5432    direct connection
#   25433 -> toxiproxy:54330  reserved for a future Postgres proxy listener
#                             (no proxy is configured yet; nothing listens
#                             there until one is created via the API)
#   8474  -> toxiproxy:8474   Toxiproxy HTTP API
# None of the verification gates use these host ports: the SQL gates go through
# `docker exec`, and the Java tests start their own containers on random ports.

name: alaka

services:
  postgres:
    image: postgres:16-alpine
    container_name: alaka-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alaka_dev_only
      POSTGRES_DB: alaka
    ports:
      - "${ALAKA_PG_HOST_PORT:-25432}:5432"
    volumes:
      - alaka-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: probe over TCP, which the image's temporary init server (unix socket only)
      # does not answer, so "healthy" cannot be reported before the post-init restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d alaka"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: alaka-toxiproxy
    command: ["-host=0.0.0.0", "-port=8474"]
    ports:
      - "8474:8474"
      - "${ALAKA_TOXI_HOST_PORT:-25433}:54330"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  alaka-pgdata:

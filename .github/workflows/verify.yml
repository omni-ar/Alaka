# Re-proves everything on every push and pull request to main:
# TLC (safe config passes, every unsafe config is rejected), the adversarial SQL suites and the
# 20-session concurrency probe on scratch Postgres 16 databases, and ./mvnw -B clean verify
# (unit, property, storm, Stripe wire, chaos and HTTP tests on Testcontainers).
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pull container images
        run: |
          docker compose pull
          docker pull ghcr.io/shopify/toxiproxy:2.12.0

      - name: scripts/verify-all.sh --wide
        run: bash scripts/verify-all.sh --wide

      - name: Upload verification logs and benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            target-verify/
            target/storm-report.txt
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
